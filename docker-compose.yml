name: kafka-retail-pipeline

x-app-common: &app-common
  build: .
  restart: unless-stopped
  environment: &app-environment
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    RAW_TOPIC: orders.raw
    ENRICHED_TOPIC: orders.enriched
    DLQ_TOPIC: orders.dlq
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-retail}
    POSTGRES_USER: ${POSTGRES_USER:-kafka_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kafka_password}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  topic-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      set -e
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.raw --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.enriched --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orders.dlq --partitions 1 --replication-factor 1

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail}
      POSTGRES_USER: ${POSTGRES_USER:-kafka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kafka_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kafka_user} -d ${POSTGRES_DB:-retail}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  producer:
    <<: *app-common
    command: ["python", "-m", "src.producer"]
    environment:
      <<: *app-environment
      EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-1.0}
    depends_on:
      topic-init:
        condition: service_completed_successfully

  processor:
    <<: *app-common
    command: ["python", "-m", "src.processor"]
    depends_on:
      topic-init:
        condition: service_completed_successfully

  sink:
    <<: *app-common
    command: ["python", "-m", "src.sink"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  dashboard:
    <<: *app-common
    command:
      - streamlit
      - run
      - src/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  postgres_data:
